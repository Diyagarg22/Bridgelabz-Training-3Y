<!DOCTYPE html>
<html>
<head>

    <!-- The title defines the name shown on the browser tab. -->
    <title>Complete Head Elements</title>

    <!-- The meta charset defines the character encoding of the webpage. -->
    <meta charset="UTF-8">

    <!-- The meta description provides a short description of the webpage. -->
    <meta name="description" content="A webpage demonstrating important HTML head elements.">

    <!-- The meta author specifies the author of the webpage. -->
    <meta name="author" content="Diya">

    <!-- The base tag defines the base URL for relative links. -->
    <base href="https://example.com/">

    <!-- The link tag connects external resources such as a favicon. -->
    <link rel="icon" href="favicon.ico">

    <!-- The style tag is used to write CSS styles. -->
    <style>
    </style>

    <!-- The script tag is used to add JavaScript. -->
    <script>
    </script>

</head>

<body>

    <h1>Important Head Elements</h1>

    <p>This page demonstrates different elements used inside the head section.</p>

</body>
</html>
