<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Image Showcase</title>

    <!-- External CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Image Showcase</h1>
        <p>Explore beautiful places around the world</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="gallery">

            <!-- Image 1 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1500534623283-312aade485b7"
                        alt="Mountain landscape">
                </div>

                <figcaption>Mountain Landscape</figcaption>

            </figure>


            <!-- Image 2 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1507525428034-b723cf961d3e"
                        alt="Beautiful beach">
                </div>

                <figcaption>Beautiful Beach</figcaption>

            </figure>


            <!-- Image 3 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1470770841072-f978cf4d019e"
                        alt="Lake and mountains">
                </div>

                <figcaption>Peaceful Lake</figcaption>

            </figure>


            <!-- Image 4 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1441974231531-c6227db76b6e"
                        alt="Green forest">
                </div>

                <figcaption>Green Forest</figcaption>

            </figure>


            <!-- Image 5 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1500530855697-b586d89ba3ee"
                        alt="Road through mountains">
                </div>

                <figcaption>Mountain Road</figcaption>

            </figure>


            <!-- Image 6 -->
            <figure class="image-card">

                <div class="image-container">
                    <img
                        src="https://images.unsplash.com/photo-1501785888041-af3ef285b470"
                        alt="Mountain valley">
                </div>

                <figcaption>Mountain Valley</figcaption>

            </figure>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Image Showcase</p>
    </footer>

</body>

</html>
