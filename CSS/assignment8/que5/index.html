<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Styled Button Collection</title>

    <!-- Linking external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>Styled Button Collection</h1>
        <p>Different button styles using CSS</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="button-section">

            <h2>Button Examples</h2>

            <div class="button-container">

                <!-- Primary Button -->
                <button class="btn primary-btn">
                    Primary Button
                </button>


                <!-- Secondary Button -->
                <button class="btn secondary-btn">
                    Secondary Button
                </button>


                <!-- Outline Button -->
                <button class="btn outline-btn">
                    Outline Button
                </button>


                <!-- Disabled Button -->
                <button class="btn disabled-btn" disabled>
                    Disabled Button
                </button>

            </div>


            <!-- Focus Demonstration -->
            <div class="focus-demo">

                <h2>Focus Demonstration</h2>

                <button class="btn focus-btn">
                    Click to Focus
                </button>

                <p>
                    Click the button and notice the focus outline.
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 Styled Button Practice</p>
    </footer>

</body>

</html>
