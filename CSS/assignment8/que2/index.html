<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Tooltip Demonstration</title>

    <!-- Linking external CSS file -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Tooltip Demonstration</h1>
        <p>Hover over the elements to see the tooltips</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="tooltip-container">

            <!-- Tooltip 1 -->
            <div class="tooltip-box">

                <span class="tooltip-element">Home</span>

                <span class="tooltip-text">
                    Go to the Home page
                </span>

            </div>


            <!-- Tooltip 2 -->
            <div class="tooltip-box">

                <span class="tooltip-element">Profile</span>

                <span class="tooltip-text">
                    View your Profile
                </span>

            </div>


            <!-- Tooltip 3 -->
            <div class="tooltip-box">

                <span class="tooltip-element">Settings</span>

                <span class="tooltip-text">
                    Open Settings
                </span>

            </div>


            <!-- Tooltip 4 -->
            <div class="tooltip-box">

                <span class="tooltip-element">Help</span>

                <span class="tooltip-text">
                    Get Help and Support
                </span>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CSS Tooltip Practice</p>
    </footer>

</body>

</html>
