<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>CSS Animation Demonstration</title>

    <!-- Linking external CSS -->
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <h1>CSS Animation Demonstration</h1>
        <p>Three different animations using CSS @keyframes</p>
    </header>


    <!-- Main Content -->
    <main>

        <section class="animation-container">

            <!-- Animation 1: Moving Box -->
            <div class="animation-card">

                <h2>Moving Box</h2>

                <div class="moving-area">
                    <div class="moving-box"></div>
                </div>

                <p>
                    The box moves from left to right and back.
                </p>

            </div>


            <!-- Animation 2: Bouncing Ball -->
            <div class="animation-card">

                <h2>Bouncing Ball</h2>

                <div class="ball-area">
                    <div class="ball"></div>
                </div>

                <p>
                    The ball continuously moves up and down.
                </p>

            </div>


            <!-- Animation 3: Color Changing Text -->
            <div class="animation-card">

                <h2>Color Changing Text</h2>

                <div class="text-area">
                    <span class="animated-text">
                        CSS Animation
                    </span>
                </div>

                <p>
                    The text changes color continuously.
                </p>

            </div>

        </section>

    </main>


    <!-- Footer -->
    <footer>
        <p>&copy; 2026 CSS Animation Practice</p>
    </footer>

</body>

</html>
