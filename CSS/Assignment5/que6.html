<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #eee;
        }

        h1 {
            text-align: center;
            padding: 20px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding: 30px;
        }

        .photo {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.2);
        }

        .photo img {
            width: 100%;
            height: 250px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s;
        }

        .caption {
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            background: rgba(0,0,0,0.7);
            color: white;
            padding: 15px;
            text-align: center;
            opacity: 0;
            transition: opacity 0.4s;
        }

        .photo:hover img {
            transform: scale(1.1);
        }

        .photo:hover .caption {
            opacity: 1;
        }

        @media (max-width: 800px) {
            .gallery {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 500px) {
            .gallery {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<h1>My Photo Gallery</h1>

<div class="gallery">

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=1">
        <div class="caption">Nature</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=2">
        <div class="caption">Mountain</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=3">
        <div class="caption">Beach</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=4">
        <div class="caption">City</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=5">
        <div class="caption">Travel</div>
    </div>

    <div class="photo">
        <img src="https://picsum.photos/500/300?random=6">
        <div class="caption">Landscape</div>
    </div>

</div>

</body>
</html>
