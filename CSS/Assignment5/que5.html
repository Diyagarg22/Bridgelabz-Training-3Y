<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pricing Plans</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f3f4f6;
        }

        h1 {
            text-align: center;
            margin: 40px;
        }

        .pricing {
            display: flex;
            gap: 25px;
            max-width: 1000px;
            margin: auto;
            align-items: stretch;
        }

        .plan {
            flex: 1;
            background: white;
            padding: 30px;
            text-align: center;
            border: 2px solid #ddd;
            border-radius: 15px;
            transition: 0.3s;
            display: flex;
            flex-direction: column;
        }

        .plan:hover {
            transform: scale(1.05);
            background: #e0f2fe;
        }

        .popular {
            border: 3px solid #2563eb;
            background: #eff6ff;
        }

        .price {
            font-size: 30px;
            font-weight: bold;
        }

        .plan ul {
            text-align: left;
            line-height: 2;
            flex: 1;
        }

        .btn {
            display: inline-block;
            padding: 12px 25px;
            background: #2563eb;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }

        @media (max-width: 600px) {
            .pricing {
                flex-direction: column;
                margin: 20px;
            }
        }
    </style>
</head>

<body>

<h1>Choose Your Plan</h1>

<div class="pricing">

    <div class="plan">
        <h2>Basic</h2>
        <p class="price">₹499</p>
        <ul>
            <li>5 Projects</li>
            <li>Basic Support</li>
            <li>1 User</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
    </div>

    <div class="plan popular">
        <h2>Standard</h2>
        <p class="price">₹999</p>
        <ul>
            <li>15 Projects</li>
            <li>Priority Support</li>
            <li>5 Users</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
    </div>

    <div class="plan">
        <h2>Premium</h2>
        <p class="price">₹1499</p>
        <ul>
            <li>Unlimited Projects</li>
            <li>Premium Support</li>
            <li>Unlimited Users</li>
        </ul>
        <a href="#" class="btn">Choose Plan</a>
    </div>

</div>

</body>
</html>
