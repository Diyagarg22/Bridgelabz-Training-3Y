<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f7fb;
            color: #172033;

            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            position: fixed;
            top: 0;
            width: 100%;
            background-color: #172033;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }

        header h1 {
            font-size: 1.5rem;
        }

        nav a {
            color: white;
            text-decoration: none;
            margin-left: 2em;
        }

        nav a:hover {
            color: #61dafb;
        }

        main {
            flex: 1;
            margin-top: 80px;
        }

        .hero {
            min-height: 80vh;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 5%;
            padding: 5%;
        }

        .bio {
            width: 50%;
        }

        .bio h2 {
            font-size: 3rem;
        }

        .bio p {
            font-size: 1.1rem;
            line-height: 1.6;
        }

        .profile {
            width: 250px;
            height: 250px;
            border-radius: 50%;
            object-fit: cover;
            border: 5px solid #172033;
        }

        footer {
            background-color: #172033;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 600px) {
            header {
                flex-direction: column;
            }

            nav a {
                margin: 0 8px;
            }

            .hero {
                flex-direction: column;
                text-align: center;
            }

            .bio {
                width: 90%;
            }
        }
    </style>
</head>

<body>

<header>
    <h1>Diya Garg</h1>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="hero">
        <div class="bio">
            <h2>Hello, I'm Diya!</h2>
            <p>
                I am a Computer Science student interested in web development,
                programming and building creative websites.
            </p>
        </div>

        <img src="https://via.placeholder.com/250"
             alt="Profile Image"
             class="profile">
    </section>
</main>

<footer>
    <p>&copy; 2026 My Portfolio</p>
</footer>

</body>
</html>
