<!DOCTYPE html>
<html>
<head>
    <title>Pricing</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial;
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .pricing {
            display: flex;
            align-items: center;
            gap: 25px;
        }

        .card {
            width: 250px;
            padding: 40px;
            text-align: center;

            background: #eee;
            border-radius: 10px;

            transition: 0.3s;

            animation: fadeIn 1s ease;
        }

        .card:hover {
            transform: translateY(-10px);
        }

        .middle {
            transform: scale(1.1);
            background: lightblue;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(30px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 750px) {
            .pricing {
                flex-direction: column;
                padding: 30px;
            }

            .middle {
                transform: none;
            }
        }
    </style>
</head>

<body>

<div class="pricing">

    <div class="card">
        <h2>Basic</h2>
        <h3>₹499</h3>
        <p>Basic features</p>
    </div>

    <div class="card middle">
        <h2>Pro</h2>
        <h3>₹999</h3>
        <p>All basic features + more</p>
    </div>

    <div class="card">
        <h2>Premium</h2>
        <h3>₹1499</h3>
        <p>All features included</p>
    </div>

</div>

</body>
</html>
