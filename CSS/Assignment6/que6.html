<!DOCTYPE html>
<html>
<head>
    <title>Blog</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            font-family: Arial;
        }

        .container {
            min-height: 100vh;

            display: grid;

            grid-template-columns: 220px 1fr;
            grid-template-rows: 80px 1fr 70px;

            grid-template-areas:
                "header header"
                "sidebar main"
                "footer footer";

            gap: 20px;
        }

        header {
            grid-area: header;
            background: #222;
            color: white;

            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
        }

        nav {
            display: flex;
            gap: 20px;
        }

        nav a {
            color: white;
        }

        aside {
            grid-area: sidebar;
            background: #eee;
            padding: 25px;
        }

        aside p {
            margin: 15px 0;
        }

        main {
            grid-area: main;

            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            padding: 20px;
        }

        article {
            padding: 30px;
            background: #eee;
        }

        footer {
            grid-area: footer;
            background: #222;
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        @media (max-width: 800px) {
            .container {
                grid-template-columns: 1fr;

                grid-template-areas:
                    "header"
                    "main"
                    "sidebar"
                    "footer";
            }

            main {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <header>
        <h1>My Blog</h1>

        <nav>
            <a href="#">Home</a>
            <a href="#">About</a>
            <a href="#">Contact</a>
        </nav>
    </header>

    <aside>
        <h3>Categories</h3>
        <p>Technology</p>
        <p>Programming</p>
        <p>Travel</p>
        <p>Education</p>
    </aside>

    <main>
        <article>
            <h2>Learning CSS Grid</h2>
            <p>CSS Grid makes webpage layouts easier and responsive.</p>
        </article>

        <article>
            <h2>Learning Flexbox</h2>
            <p>Flexbox is useful for one-dimensional layouts.</p>
        </article>
    </main>

    <footer>
        Contact: example@email.com
    </footer>

</div>

</body>
</html>
