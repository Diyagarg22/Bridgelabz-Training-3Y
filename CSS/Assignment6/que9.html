<!DOCTYPE html>
<html>
<head>
    <title>Card Flip</title>

    <style>
        body {
            margin: 0;
            height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family: Arial;
        }

        .card-container {
            width: 300px;
            height: 400px;

            perspective: 1000px;
        }

        .card {
            width: 100%;
            height: 100%;

            position: relative;

            transition: transform 0.8s;
            transform-style: preserve-3d;
        }

        .card-container:hover .card {
            transform: rotateY(180deg);
        }

        .front,
        .back {
            position: absolute;

            width: 100%;
            height: 100%;

            backface-visibility: hidden;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            border-radius: 15px;
        }

        .front {
            background: lightblue;
        }

        .front img {
            width: 150px;
            height: 150px;
            border-radius: 50%;
        }

        .back {
            background: lightgray;
            transform: rotateY(180deg);
            padding: 20px;
            box-sizing: border-box;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="card-container">

    <div class="card">

        <div class="front">
            <img src="https://picsum.photos/200">
            <h2>My Profile</h2>
        </div>

        <div class="back">
            <h2>About Me</h2>
            <p>
                I am a Computer Science student interested
                in programming and web development.
            </p>
        </div>

    </div>

</div>

</body>
</html>
