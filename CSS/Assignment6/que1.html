<!DOCTYPE html>
<html>
<head>
    <title>Personal Portfolio</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px 50px;
            background: #222;
            color: white;
        }

        nav {
            display: flex;
            gap: 25px;
        }

        nav a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 50px;
            padding: 50px;
        }

        .about {
            max-width: 500px;
        }

        .image img {
            width: 250px;
            height: 250px;
            object-fit: cover;
            border-radius: 50%;
        }

        footer {
            text-align: center;
            padding: 20px;
            background: #222;
            color: white;
        }

        @media (max-width: 700px) {
            header,
            main {
                flex-direction: column;
            }

            header {
                gap: 20px;
            }

            main {
                text-align: center;
            }
        }
    </style>
</head>

<body>

<header>
    <h2>Diya Garg</h2>

    <nav>
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Projects</a>
        <a href="#">Contact</a>
    </nav>
</header>

<main>
    <section class="about">
        <h1>About Me</h1>
        <p>
            Hello! I am a Computer Science student interested in
            web development and programming. I enjoy learning new
            technologies and building projects.
        </p>
    </section>

    <section class="image">
        <img src="https://picsum.photos/300" alt="Profile">
    </section>
</main>

<footer>
    © 2026 My Portfolio
</footer>

</body>
</html>
