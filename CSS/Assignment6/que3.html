<!DOCTYPE html>
<html>
<head>
    <title>Homepage</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
        }

        body {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            font-family: Arial;
        }

        header {
            padding: 20px;
            background: #222;
            color: white;

            display: flex;
            justify-content: space-around;
        }

        header a {
            color: white;
            text-decoration: none;
        }

        main {
            flex: 1;

            display: flex;
            justify-content: center;
            align-items: center;
            gap: 30px;
            padding: 30px;
        }

        .box {
            padding: 50px;
            background: lightgray;
            border-radius: 10px;

            transition: 0.3s;
        }

        .box:hover {
            transform: rotate(2deg);
        }

        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
        }

        @media (max-width: 700px) {
            main {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<header>
    <a href="#">Home</a>
    <a href="#">Services</a>
    <a href="#">Projects</a>
    <a href="#">Contact</a>
</header>

<main>
    <div class="box">Services</div>
    <div class="box">Projects</div>
    <div class="box">Contact</div>
</main>

<footer>
    © 2026 My Website
</footer>

</body>
</html>
