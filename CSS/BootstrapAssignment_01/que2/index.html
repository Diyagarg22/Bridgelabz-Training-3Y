<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Portfolio</title>

    <!-- Bootstrap CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body class="bg-light text-dark">

<header class="text-center p-5 bg-dark text-white">
    <h1 class="fw-bold">Diya Garg</h1>
    <p class="lead">Computer Science Student & Aspiring Software Developer</p>
</header>

<main>
    <section class="container text-center mt-4">

        <img src="https://images.unsplash.com/photo-1494790108377-be9c29b29330"
             class="img-fluid rounded-circle profile-img"
             alt="Profile">

        <h2 class="mt-4 fw-bold">Hello, I'm Diya</h2>

        <p class="mb-3">
            I am passionate about web development, programming and
            creating useful digital products.
        </p>

        <!-- Bootstrap buttons -->
        <button class="btn btn-primary me-2">Hire Me</button>
        <button class="btn btn-outline-dark">Download CV</button>

        <div class="row justify-content-center mt-5">
            <div class="col-md-6">

                <h3 class="mb-3">Contact Me</h3>

                <form>
                    <input type="text"
                           class="form-control mb-3"
                           placeholder="Your Name">

                    <input type="email"
                           class="form-control mb-3"
                           placeholder="Your Email">

                    <textarea class="form-control mb-3"
                              rows="4"
                              placeholder="Your Message"></textarea>

                    <button class="btn btn-dark w-100">
                        Send Message
                    </button>
                </form>

            </div>
        </div>

    </section>
</main>

<footer class="text-center mt-5 p-3 bg-dark text-white">
    © 2026 Diya Garg
</footer>

</body>
</html>
