<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pricing Plans</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="text-center p-5 bg-dark text-white">
    <h1>Choose Your Plan</h1>
    <p class="lead">Simple pricing for everyone</p>
</header>

<main class="container py-5">

    <div class="row g-4">

        <!-- Basic Plan -->
        <div class="col-12 col-md-4">
            <div class="card h-100 shadow-lg pricing-card">
                <div class="card-body text-center">
                    <h2>Basic</h2>
                    <h3>₹299 <small>/month</small></h3>

                    <ul class="list-group list-group-flush my-4">
                        <li class="list-group-item">5 Projects</li>
                        <li class="list-group-item">5 GB Storage</li>
                        <li class="list-group-item">Email Support</li>
                    </ul>

                    <button class="btn btn-outline-primary">
                        Choose Plan
                    </button>
                </div>
            </div>
        </div>

        <!-- Pro Plan -->
        <div class="col-12 col-md-4">
            <div class="card h-100 shadow-lg pricing-card bg-primary text-white">
                <div class="card-body text-center">
                    <h2>Pro</h2>
                    <h3>₹599 <small>/month</small></h3>

                    <ul class="list-group list-group-flush my-4">
                        <li class="list-group-item">20 Projects</li>
                        <li class="list-group-item">50 GB Storage</li>
                        <li class="list-group-item">Priority Support</li>
                    </ul>

                    <button class="btn btn-light">
                        Choose Plan
                    </button>
                </div>
            </div>
        </div>

        <!-- Premium Plan -->
        <div class="col-12 col-md-4">
            <div class="card h-100 shadow-lg pricing-card">
                <div class="card-body text-center">
                    <h2>Premium</h2>
                    <h3>₹999 <small>/month</small></h3>

                    <ul class="list-group list-group-flush my-4">
                        <li class="list-group-item">Unlimited Projects</li>
                        <li class="list-group-item">200 GB Storage</li>
                        <li class="list-group-item">24/7 Support</li>
                    </ul>

                    <button class="btn btn-outline-primary">
                        Choose Plan
                    </button>
                </div>
            </div>
        </div>

    </div>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 CloudPro
</footer>

</body>
</html>
