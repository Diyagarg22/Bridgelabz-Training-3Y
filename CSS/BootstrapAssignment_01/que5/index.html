<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>TechVerse Blog</title>

    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap"
          rel="stylesheet">

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="py-5 text-center">
    <h1 class="fw-bold">TechVerse</h1>
    <p>Explore Technology, AI and Programming</p>
</header>

<main class="container py-5">

    <div class="row g-4">

        <div class="col-md-6">
            <article class="card h-100 shadow">
                <img src="https://images.unsplash.com/photo-1518770660439-4636190af475"
                     class="card-img-top"
                     alt="Technology">

                <div class="card-body">
                    <h2 class="card-title">The Future of Technology</h2>

                    <p class="card-text">
                        Technology is changing the way we learn,
                        communicate and work every day.
                    </p>

                    <button class="btn btn-primary">Read More</button>
                </div>
            </article>
        </div>

        <div class="col-md-6">
            <article class="card h-100 shadow">
                <img src="https://images.unsplash.com/photo-1677442136019-21780ecad995"
                     class="card-img-top"
                     alt="Artificial Intelligence">

                <div class="card-body">
                    <h2 class="card-title">Understanding Artificial Intelligence</h2>

                    <p class="card-text">
                        AI is becoming an important part of modern
                        applications and software development.
                    </p>

                    <button class="btn btn-primary">Read More</button>
                </div>
            </article>
        </div>

    </div>

</main>

<footer class="text-center p-4">
    © 2026 TechVerse Blog
</footer>

</body>
</html>
