<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Catalog</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="bg-dark text-white text-center p-4">
    <h1>Tech Store</h1>
    <p>Quality products at affordable prices</p>
</header>

<main class="container py-5">

    <h2 class="text-center mb-4">Our Products</h2>

    <div class="row g-4">

        <!-- col-md-3 = 4 columns on desktop, 2 on tablet, 1 on mobile -->
        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1541807084-5c52b6b3adef"
                     class="card-img-top"
                     alt="Laptop">
                <div class="card-body">
                    <h5 class="card-title">Laptop</h5>
                    <p class="fw-bold">₹55,000</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1523275335684-37898b6baf30"
                     class="card-img-top"
                     alt="Smart Watch">
                <div class="card-body">
                    <h5 class="card-title">Smart Watch</h5>
                    <p class="fw-bold">₹4,999</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1505740420928-5e560c06d30e"
                     class="card-img-top"
                     alt="Headphones">
                <div class="card-body">
                    <h5 class="card-title">Headphones</h5>
                    <p class="fw-bold">₹2,499</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

        <div class="col-12 col-sm-6 col-md-3">
            <div class="card shadow-sm product-card">
                <img src="https://images.unsplash.com/photo-1600080972464-8e5f35f63d08"
                     class="card-img-top"
                     alt="Keyboard">
                <div class="card-body">
                    <h5 class="card-title">Keyboard</h5>
                    <p class="fw-bold">₹1,999</p>
                    <button class="btn btn-primary w-100">Add to Cart</button>
                </div>
            </div>
        </div>

    </div>
</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 Tech Store
</footer>

</body>
</html>
