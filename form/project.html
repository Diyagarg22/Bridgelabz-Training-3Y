<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<body>
    <form>
    <fieldset>
        <legend>Student Registration Form</legend>
        <br><h2> Personal Details</h2>

        <label for="enter id">Enter ID</label>
        <input type="text" placeholder="Enter your ID" id="enter id">
        <br> <br>
        <label for="enter psd">Enter Password</label>
        <input type="password" placeholder="Enter Password" id="enter psd">
        <br> <br>
        <label for="choose date">Choose Date</label>
        <input type="date" id="choose date">
        <br> <br>
        <label for="Gender">Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        
        
    </fieldset>
    </form>
</body>
