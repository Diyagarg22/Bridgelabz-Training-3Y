<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <form>
    <fieldset>
        <legend>Student Registration Form</legend>
        <br><h2> Personal Details</h2>

        <label for="enter id">Enter ID</label>
        <input type="text" placeholder="Enter your ID" id="enter id">
        <br> <br>
        <label for="enter psd">Enter Password</label>
        <input type="password" placeholder="Enter Password" id="enter psd">
        <br> <br>
        <label for="choose date">Choose Date</label>
        <input type="date" id="choose date">
        <br> <br>
        <label for="Gender">Gender:</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">Female</label>
        <br><br>
        <label for="Languages:"> Languages:</label>
        <input type="checkbox" id="checkbox1" name="checkbox1">
        <label for="checkbox1">Hindi</label>
        <input type="checkbox" id="checkbox2" name="checkbox2">
        <label for="checkbox2">English</label>
        <br><br>
        <label for="File">Upload a File:</label>
        <input type="file" id="file" name="file">
        <br><br>
        <label for="dish">Choose Your Dish:</label>
        <select name="dishes" id="Selector1">
            <option value="maggie">Maggie</option>
            <option value="Samosa">Samosa</option>
            <option value="pizza">Pizza</option>
        </select>
        <br><br>
        <label for="Enter Message:">Enter Message:</label>
        
    </fieldset>
    </form>
</body>
</html>
