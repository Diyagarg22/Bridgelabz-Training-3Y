<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
        <label for="name">Name</label>   
        <input type="text" id="name">    <br> 
        <label for="email">Email</label> 
        <input type="email" id="Email">   <br>    
        <label for="phone">phone</label>  
        <input type="tel">      <br>
        <label for="DOB">DOB</label>  
        <input type="date">      <br>
        <label for="password">password</label>  
        <input type="password">   <br>   
        
        <label for="Gender">Gender</label>
        <input type="radio" name="gender" value="male" id="male">
        <label for="male">Male</label>
        <input type="radio" name="gender" value="female" id="female">
        <label for="female">female</label>
        <div>
        <label for="Course">Course</label>
        
        <select name="course" id="course">
        <option value="btech">btech</option>
        <option value="mba">MBA</option>
        <option value="bba">BBA</option>
        </select>
        </div>
        
        <label for="Skills">Skills</label>
        <br>
        <input type="checkbox" name="Skills" value="java" id="java">
        <label for="java">java</label> <br>
        <input type="checkbox" name="skills" value="js" id="js">
        <label for="javascript">javascript</label>
        <br>
        <input type="checkbox" name="skills" value="react" id="react">
        <label for="react"> react</label>
        <br>
        <label for="Internship Prefrence:">Internship Prefrence:</label>
        <input type="radio" name="IP" value="diya" id="diya">
        <label for="diya">diya</label>
        <input type="radio" name="IP" value="sajal" id="sajal">
<label for="sajal">sajal</label>
<br>
<label for="resume">resume:</label>
<input type="file" name="resume" accept=".pdf" id="resume" required>
<br>
<label for="cover letter"> coverletter</label>
<textarea name="cover letter" id="coverletter " rows="5" cols="42"></textarea> <br>
<input type="submit" value="submit">
<input type="reset" value="reset">
    
    
</body>
</html>
