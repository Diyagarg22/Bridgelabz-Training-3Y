
<!DOCTYPE html>
<html>
<head>
    <title>Mouse Coordinates</title>
    <style>
        #mouseBox {
            width: 400px;
            height: 400px;
            border: 2px solid black;
            position: relative;
            background-color: #f2f2f2;
            overflow: hidden;
        }

        .dot {
            width: 10px;
            height: 10px;
            background-color: red;
            border-radius: 50%;
            position: absolute;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <h2>Mouse Coordinates Logger</h2>

    <div id="mouseBox"></div>

    <p id="coordinates">Move your mouse inside the box.</p>

    <script>
        const mouseBox = document.getElementById("mouseBox");
        const coordinates = document.getElementById("coordinates");

        // Track mouse movement inside the box
        mouseBox.addEventListener("mousemove", function (event) {
            coordinates.textContent =
                "clientX: " + event.clientX +
                " | clientY: " + event.clientY;
        });

        // Add a red dot on double-click
        mouseBox.addEventListener("dblclick", function (event) {
            const boxPosition = mouseBox.getBoundingClientRect();

            // Find click position relative to the box
            const x = event.clientX - boxPosition.left;
            const y = event.clientY - boxPosition.top;

            const dot = document.createElement("div");
            dot.classList.add("dot");

            dot.style.left = x + "px";
            dot.style.top = y + "px";

            mouseBox.appendChild(dot);
        });
    </script>
</body>
</html>
