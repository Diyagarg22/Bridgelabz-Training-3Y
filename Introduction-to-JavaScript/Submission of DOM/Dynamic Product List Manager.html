
<!DOCTYPE html>
<html>
<head>
    <title>Product Manager</title>
</head>
<body>
    <h2>Product List</h2>

    <input type="text" id="productInput" placeholder="Enter product">
    <button id="addButton">Add Product</button>

    <ul id="productList"></ul>

    <script>
        const productInput = document.getElementById("productInput");
        const addButton = document.getElementById("addButton");
        const productList = document.getElementById("productList");

        // Add a new product
        addButton.addEventListener("click", function () {
            const productName = productInput.value.trim();

            if (productName === "") {
                alert("Please enter a product name");
                return;
            }

            const listItem = document.createElement("li");
            listItem.innerHTML = `
                <span>${productName}</span>
                <button class="editButton">Edit</button>
                <button class="deleteButton">Delete</button>
            `;

            productList.appendChild(listItem);
            productInput.value = "";
        });

        // Event delegation: handle Edit and Delete on parent UL
        productList.addEventListener("click", function (event) {
            const listItem = event.target.closest("li");

            if (!listItem) return;

            if (event.target.classList.contains("deleteButton")) {
                listItem.remove();
            }

            if (event.target.classList.contains("editButton")) {
                startEditing(listItem);
            }
        });

        function startEditing(listItem) {
            const productText = listItem.querySelector("span");

            if (listItem.querySelector("input")) return;

            const editInput = document.createElement("input");
            editInput.value = productText.textContent;

            productText.replaceWith(editInput);
            editInput.focus();

            function saveEdit() {
                const newText = document.createElement("span");
                newText.textContent = editInput.value.trim() || productText.textContent;
                editInput.replaceWith(newText);
            }

            // Save when Enter is pressed
            editInput.addEventListener("keydown", function (event) {
                if (event.key === "Enter") {
                    saveEdit();
                }
            });

            // Save when clicking outside the edited item
            document.addEventListener("click", function outsideClick(event) {
                if (!listItem.contains(event.target)) {
                    saveEdit();
                    document.removeEventListener("click", outsideClick);
                }
            });
        }
    </script>
</body>
</html>
