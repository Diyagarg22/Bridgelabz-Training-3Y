
<!DOCTYPE html>
<html>
<head>
    <title>Multi-Step Form</title>
</head>
<body>
    <h2>Registration Form</h2>

    <div id="step1">
        <h3>Step 1: Name</h3>
        <input type="text" id="name" placeholder="Enter your name">
        <p id="nameError"></p>
    </div>

    <div id="step2" hidden>
        <h3>Step 2: Email</h3>
        <input type="email" id="email" placeholder="Enter your email">
        <p id="emailError"></p>
    </div>

    <div id="step3" hidden>
        <h3>Step 3: Password</h3>
        <input type="password" id="password" placeholder="Enter password">
        <p id="passwordError"></p>
    </div>

    <div id="summary" hidden>
        <h3>Registration Summary</h3>
        <p id="summaryDetails"></p>
    </div>

    <button id="backButton" hidden>Back</button>
    <button id="nextButton">Next</button>

    <script>
        let currentStep = 1;

        const nextButton = document.getElementById("nextButton");
        const backButton = document.getElementById("backButton");

        function showStep() {
            // Hide all steps and summary
            document.getElementById("step1").hidden = true;
            document.getElementById("step2").hidden = true;
            document.getElementById("step3").hidden = true;
            document.getElementById("summary").hidden = true;

            // Show current step
            if (currentStep <= 3) {
                document.getElementById("step" + currentStep).hidden = false;
            }

            backButton.hidden = currentStep === 1;
            nextButton.textContent = currentStep === 3 ? "Submit" : "Next";
        }

        function validateStep() {
            if (currentStep === 1) {
                const name = document.getElementById("name").value.trim();

                if (name === "") {
                    document.getElementById("nameError").textContent =
                        "Name is required";
                    return false;
                }

                document.getElementById("nameError").textContent = "";
            }

            if (currentStep === 2) {
                const email = document.getElementById("email").value.trim();

                if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
                    document.getElementById("emailError").textContent =
                        "Enter a valid email";
                    return false;
                }

                document.getElementById("emailError").textContent = "";
            }

            if (currentStep === 3) {
                const password = document.getElementById("password").value;

                if (password.length < 6) {
                    document.getElementById("passwordError").textContent =
                        "Password must have at least 6 characters";
                    return false;
                }

                document.getElementById("passwordError").textContent = "";
            }

            return true;
        }

        nextButton.addEventListener("click", function () {
            if (!validateStep()) return;

            if (currentStep < 3) {
                currentStep++;
                showStep();
            } else {
                document.getElementById("summaryDetails").textContent =
                    "Name: " + document.getElementById("name").value +
                    " | Email: " + document.getElementById("email").value;

                document.getElementById("step3").hidden = true;
                document.getElementById("summary").hidden = false;

                nextButton.hidden = true;
                backButton.hidden = true;
            }
        });

        backButton.addEventListener("click", function () {
            if (currentStep > 1) {
                currentStep--;
                showStep();
            }
        });

        showStep();
    </script>
</body>
</html>
