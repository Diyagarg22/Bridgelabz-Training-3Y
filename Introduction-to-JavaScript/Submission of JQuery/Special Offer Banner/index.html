<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Special Offers</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        .banner {
            background-color: lightblue;
            padding: 20px;
            margin: 10px;
            text-align: center;
        }
    </style>
</head>
<body>
    <header>
        <h1>Special Offers</h1>
    </header>

    <main>
        <div class="banner">Offer 1: 20% Off on Electronics</div>
        <div class="banner">Offer 2: Free Delivery</div>
        <div class="banner">Offer 3: Buy One Get One</div>
        <div class="banner">Offer 4: Festival Sale</div>
        <div class="banner">Offer 5: Special Student Discount</div>

        <button id="hide">Hide First</button>
        <button id="show">Show All</button>
        <button id="slideUp">Slide Up</button>
        <button id="slideDown">Slide Down</button>
        <button id="fadeOut">Fade Out</button>
        <button id="fadeIn">Fade In</button>
    </main>

    <script src="Q4.js"></script>
</body>
</html>
